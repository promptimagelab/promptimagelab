version: '3.8'

services:
  antigravity-proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: antigravity_proxy
    ports:
      - "8080:8080"
    environment:
      - CONTROL_PLANE_URL=http://antigravity-backend:8000
    depends_on:
      - antigravity-backend
    restart: unless-stopped
    networks:
      - antigravity_network

  antigravity-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antigravity_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - antigravity_network

  antigravity-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: antigravity_frontend
    ports:
      - "3000:3000"
    environment:
      # Since Client Components fetch from the browser, these must be public localhost URLs 
      # when testing locally. In production, these would be the real domain names.
      - NEXT_PUBLIC_PROXY_URL=http://localhost:8080/v1
      - NEXT_PUBLIC_CONTROL_PLANE_URL=http://localhost:8000
    depends_on:
      - antigravity-backend
    restart: unless-stopped
    networks:
      - antigravity_network

  antigravity-redis:
    image: redis:alpine
    container_name: antigravity_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - antigravity_network

networks:
  antigravity_network:
    driver: bridge
